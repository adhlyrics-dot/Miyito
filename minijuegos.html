<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Juegos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Kufi+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#4d2c5e;--rosa:#ffb7d0;--amarillo:#fff4b8;--lila:#d9c2f0;--celeste:#c7e3ff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#ffd5d9;color:var(--ink);font-family:'Press Start 2P',monospace;font-size:12px;line-height:1.8;overflow-x:hidden}
html[lang="ar"] body{font-family:'Noto Kufi Arabic',sans-serif;font-size:16px;line-height:2;font-weight:500}
#scene{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;z-index:0}
.langs{position:fixed;top:8px;inset-inline-end:8px;z-index:5;display:flex;gap:6px}
.langs button{font:inherit;font-size:10px;color:var(--ink);background:#fff;border:3px solid var(--ink);padding:8px 10px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;min-width:44px;min-height:40px}
html[lang="ar"] .langs button{font-family:'Noto Kufi Arabic',sans-serif}
.langs button[aria-pressed="true"]{background:var(--amarillo)}
.langs button:active{transform:translate(3px,3px);box-shadow:none}
main{position:relative;z-index:2;min-height:100vh;max-width:520px;margin:0 auto;padding:72px 16px 40px;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:20px}
.title{font-size:clamp(26px,9vw,46px);line-height:1.35;text-align:center;margin:16px 0 0;color:#fff;
 text-shadow:-3px 0 var(--ink),3px 0 var(--ink),0 -3px var(--ink),0 3px var(--ink),3px 3px 0 var(--ink),-3px -3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),6px 6px 0 var(--rosa)}
html[lang="ar"] .title{font-size:clamp(34px,11vw,60px);line-height:1.5}
.title i{display:inline-block;width:.8em;height:.8em;margin:0 .3em;vertical-align:middle;background:var(--fl) center/contain no-repeat;image-rendering:pixelated}
.sub{text-align:center;font-size:10px;background:rgba(255,255,255,.9);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:8px 12px;align-self:center}
html[lang="ar"] .sub{font-size:14px}
nav{display:flex;flex-direction:column;gap:18px;margin-top:8px}
.game{--c:var(--rosa);position:relative;display:flex;align-items:center;justify-content:center;gap:12px;text-decoration:none;color:var(--ink);font-size:15px;min-height:76px;padding:18px 20px;margin:4px;text-shadow:1px 1px 0 rgba(255,255,255,.75);
 background:linear-gradient(180deg,color-mix(in srgb,var(--c) 45%,#fff) 0,var(--c) 55%,color-mix(in srgb,var(--c) 80%,#e0669b) 100%);
 box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),inset 0 4px 0 0 rgba(255,255,255,.7),inset 4px 0 0 0 rgba(255,255,255,.4),inset 0 -6px 0 0 rgba(214,90,143,.28);
 filter:drop-shadow(5px 6px 0 rgba(77,44,94,.3));transition:filter .1s}
.game i{width:24px;height:24px;background:var(--fl) center/contain no-repeat;image-rendering:pixelated;flex:none}
.game:hover{filter:brightness(1.07) drop-shadow(5px 6px 0 rgba(77,44,94,.3))}
.game:active{transform:translate(3px,4px);filter:none}
.game:focus-visible,.langs button:focus-visible{outline:3px dashed var(--ink);outline-offset:4px}
html[lang="ar"] .game{font-weight:700;font-size:20px}
.game::before,.game::after{content:"▶";font-size:12px;animation:nudge 1s steps(2) infinite}
.game::after{content:"◀"}
@keyframes nudge{50%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.game::before,.game::after{animation:none}}

.hidden{display:none!important}
.box{background:rgba(255,255,255,.93);border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:16px;text-align:start}
.btn{--c:var(--lila);position:relative;font:inherit;font-size:13px;color:var(--ink);border:0;margin:4px;width:calc(100% - 8px);padding:16px 40px;min-height:56px;cursor:pointer;text-shadow:1px 1px 0 rgba(255,255,255,.75);
  background:linear-gradient(#fff,#fff) right 14px top 9px/8px 2px no-repeat,linear-gradient(#fff,#fff) right 17px top 6px/2px 8px no-repeat,
    linear-gradient(180deg,color-mix(in srgb,var(--c) 50%,#fff) 0,var(--c) 55%,color-mix(in srgb,var(--c) 82%,#e0669b) 100%);
  box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),inset 0 4px 0 0 rgba(255,255,255,.7),inset 4px 0 0 0 rgba(255,255,255,.4),inset 0 -6px 0 0 rgba(214,90,143,.28),inset -4px 0 0 0 rgba(214,90,143,.16);
  filter:drop-shadow(4px 5px 0 rgba(77,44,94,.3));transition:filter .1s}
.btn::before{content:"";position:absolute;inset-inline-start:12px;top:50%;width:20px;height:20px;margin-top:-10px;background:var(--flor) center/contain no-repeat;image-rendering:pixelated}
.btn:hover{filter:brightness(1.07) drop-shadow(4px 5px 0 rgba(77,44,94,.3))}
.btn:focus-visible,input:focus-visible,.langs button:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.btn.verdad{--c:var(--celeste)}
.btn.reto{--c:var(--rosa)}
.btn.ok{--c:var(--menta)}
.btn.skip{--c:var(--durazno)}
input{font:inherit;font-size:16px;text-transform:uppercase;letter-spacing:4px;text-align:center;color:var(--ink);background:#fff;border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:14px;width:100%;min-height:56px;direction:ltr}
.msg{min-height:1.8em;text-align:center;font-size:11px}
html[lang="ar"] .msg{font-size:15px}
.msg.err{background:var(--rosa);border:3px solid var(--ink);padding:8px}
.themes .msg{margin-top:10px}
.profile{display:flex;flex-direction:column;gap:12px}
.avrow{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.avrow button{font-size:24px;line-height:1;background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);width:46px;height:46px;cursor:pointer;padding:0}
.avrow button[aria-pressed="true"]{background:var(--amarillo);transform:translateY(-3px) scale(1.08)}
#nameIn{text-transform:none;letter-spacing:1px;font-size:14px;font-family:'Noto Kufi Arabic','Press Start 2P',sans-serif}
.pcard{border:4px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:9px;line-height:1.5;opacity:.82;transition:transform .2s}
html[lang="ar"] .pcard{font-size:13px}
.pcard.host{background:var(--menta)}
.pcard.guest{background:var(--durazno)}
.pav{font-size:34px;line-height:1.1;display:inline-block}
#choose .btn.verdad::after{content:" 🔮"}
#choose .btn.reto::after{content:" 🔥"}
.box{box-shadow:4px 4px 0 var(--ink),inset 0 0 0 3px #fff,inset 0 0 0 5px var(--rosa)}
.pcard{position:relative;background:var(--pc,#fff)}
.pcard.host,.pcard.guest{background:var(--pc,#c8f2d4)}
.pcard.f1{border-style:dashed;border-width:5px}
.pcard.f2{border-style:double;border-width:8px}
.pcard.f3{box-shadow:4px 4px 0 var(--ink),0 0 0 3px #fff,0 0 0 6px var(--rosa)}
.pcard.f3::after{content:"✦";position:absolute;top:-14px;inset-inline-end:-10px;font-size:20px;color:#ffd54a;text-shadow:2px 2px 0 var(--ink)}
.swrow{gap:6px}
.swrow button.sw{background:var(--s);width:34px;height:34px}
.swrow button.sw[aria-pressed="true"]{outline:3px solid #fff;outline-offset:-7px}
.avrow.chars button{width:64px;height:64px;padding:4px}
.avrow.chars button.cat{width:calc(33.333% - 6px);height:auto;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px;font:inherit;font-size:9px;line-height:1.4;color:var(--ink);word-break:break-word}
.avrow.chars button.cat img,.avrow.chars button.cat .ph,.stkpanel button.gt img,.stkpanel button.gt .ph{display:block;width:100%;height:auto;aspect-ratio:1;object-fit:cover;border:2px solid var(--ink);background:#fff}
.avrow.chars button.cat .ph,.stkpanel button.gt .ph{border-style:dashed;opacity:.45}
.avrow button img,.pav img{display:block;width:100%;height:100%;object-fit:contain;image-rendering:auto}
.pav img{width:64px;height:64px}
.avrow button.fb{--pc:#fff4b8;background:var(--pc)}
.avrow button.fb[aria-pressed="true"]{background-color:var(--pc);outline:3px solid var(--ink);outline-offset:3px}
.avrow button.fb.f1{border-style:dashed;border-width:5px}
.avrow button.fb.f2{border-style:double;border-width:8px}
.avrow button.fb.f3{box-shadow:3px 3px 0 var(--ink),0 0 0 3px #fff,0 0 0 6px var(--rosa)}
.pcard.f4,.avrow button.fb.f4{border-style:dotted;border-width:6px}
.pcard.f5,.avrow button.fb.f5{border-style:groove;border-width:8px;border-color:#ff9bb0}
.pcard.f6,.avrow button.fb.f6{border-style:ridge;border-width:8px;border-color:#7fd0ff}
.pcard.f7,.avrow button.fb.f7{box-shadow:4px 4px 0 var(--ink),0 0 0 3px #fff,0 0 0 6px #ffd54a,0 0 0 9px var(--ink)}
.pcard.f8,.avrow button.fb.f8{border-color:#3aa0ff;box-shadow:4px 4px 0 var(--ink),0 0 0 3px #fff,0 0 0 6px #7fd0ff}
.pcard.f9,.avrow button.fb.f9{border:5px solid transparent;background:linear-gradient(var(--pc),var(--pc)) padding-box,linear-gradient(90deg,#ff7aa8,#ffd54a,#8ce99a,#7fd0ff,#c9a6ff) border-box}
.pcard.f10,.avrow button.fb.f10{border:6px solid transparent;background:linear-gradient(var(--pc),var(--pc)) padding-box,repeating-linear-gradient(45deg,#ff7aa8 0 8px,#fff 8px 16px) border-box}
.pcard.f11,.avrow button.fb.f11{box-shadow:4px 4px 0 var(--ink),inset 0 0 0 3px #fff,inset 0 0 0 6px #cdb4db}
.mini{font:inherit;font-size:10px;color:var(--ink);background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:8px 10px;min-height:44px;cursor:pointer}
.mini:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
html[lang="ar"] .mini{font-family:'Noto Kufi Arabic',sans-serif;font-size:13px}

/* ===== Pantallas de la plataforma (se reutilizan los componentes del juego) ===== */
:root{--bg:#ffeef5;--menta:#c8f2d4;--durazno:#ffd9b8}
.msg.good{background:var(--menta);border:3px solid var(--ink);padding:8px}
.pprev{display:flex;justify-content:center;padding:6px 0}
.pprev .pcard{width:min(220px,72%);opacity:1}
.pprev .pname{word-break:break-word}
.top{position:fixed;top:8px;inset-inline-start:8px;z-index:5;display:flex;gap:6px}
.top button,.tabs2 button{font:inherit;font-size:10px;color:var(--ink);background:#fff;border:3px solid var(--ink);padding:8px 10px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;min-height:40px}
html[lang="ar"] .top button,html[lang="ar"] .tabs2 button{font-family:'Noto Kufi Arabic',sans-serif;font-size:13px}
.top button:active,.tabs2 button:active{transform:translate(3px,3px);box-shadow:none}
.top button:focus-visible,.tabs2 button:focus-visible{outline:3px dashed var(--ink);outline-offset:4px}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs2 button[aria-pressed="true"]{background:var(--amarillo)}
.stack{display:flex;flex-direction:column;gap:12px}
.fld{text-transform:none;letter-spacing:0;text-align:start;font-size:14px;font-family:'Noto Kufi Arabic','Press Start 2P',sans-serif;direction:ltr;unicode-bidi:plaintext}
html[lang="ar"] .fld{font-size:16px}
.linkbtn{font:inherit;font-size:10px;color:var(--ink);background:none;border:0;padding:8px 4px;min-height:40px;text-decoration:underline;cursor:pointer;align-self:center;text-align:center}
html[lang="ar"] .linkbtn{font-family:'Noto Kufi Arabic',sans-serif;font-size:14px}
.linkbtn:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.btn[disabled]{opacity:.6;cursor:wait}
@media (max-width:400px){.top button{font-size:9px;padding:8px 7px}}

/* ===== Menú de juegos: dos por fila, cada uno con su portada ===== */
html.boot main,html.boot .top{visibility:hidden}
nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
nav .sub{grid-column:1/-1;justify-self:center}
.game{flex-direction:column;gap:10px;min-height:0;margin:4px;padding:14px 10px 16px;font-size:11px;line-height:1.5;text-align:center}
.game::before,.game::after{display:none}
.game .cv{display:block;width:100%;aspect-ratio:1;border:3px solid var(--ink);background:#fff var(--fl) center/28% no-repeat;image-rendering:pixelated;overflow:hidden}
.game .cv img{display:block;width:100%;height:100%;object-fit:cover;image-rendering:auto}
.game .nm{display:block;overflow-wrap:anywhere}
html[lang="ar"] .game{font-size:17px}
.bar{display:flex;justify-content:center}
.bar .mini{min-width:160px}
@media (max-width:360px){.game{font-size:9px;padding:10px 6px 12px}}

/* ===== Pulido de botones + temas ===== */
.mini,.top button,.langs button,.tabs2 button{--c:#fff}
.langs button[aria-pressed="true"]{--c:var(--amarillo)}
:is(.mini,.top button,.langs button,.tabs2 button):not(#_){position:relative;border:0;margin:4px;color:var(--ink);text-shadow:1px 1px 0 rgba(255,255,255,.75);
 background:linear-gradient(180deg,color-mix(in srgb,var(--c) 45%,#fff) 0,var(--c) 55%,color-mix(in srgb,var(--c) 82%,#9a7ab8) 100%);
 box-shadow:0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),inset 0 4px 0 0 rgba(255,255,255,.7),inset 4px 0 0 0 rgba(255,255,255,.35),inset 0 -5px 0 0 rgba(77,44,94,.16);
 filter:drop-shadow(4px 5px 0 rgba(77,44,94,.28));transition:filter .1s,transform .1s}
:is(.mini,.top button,.langs button,.tabs2 button):not(#_):hover{filter:brightness(1.08) drop-shadow(4px 5px 0 rgba(77,44,94,.28))}
:is(.mini,.top button,.langs button,.tabs2 button):not(#_):active{transform:translate(3px,4px);filter:none}

.top button,.langs button{margin:3px}
.avrow button{transition:transform .1s}.avrow button:hover{transform:translateY(-3px)}
#tbg{position:fixed;inset:0;z-index:0;overflow:hidden;background:transparent}
#tbg video,#tbg img{display:block;width:100%;height:100%;object-fit:cover}
html.tbg #scene{display:none}
.bar{gap:10px;flex-wrap:wrap}
#thPanel{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
#thPanel .th{font:inherit;font-size:9px;color:var(--ink);background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;min-height:84px;justify-content:center}
#thPanel .th img,#thPanel .th video{width:100%;aspect-ratio:1;object-fit:cover;border:2px solid var(--ink);display:block;background:#000}
#thPanel .th[aria-pressed="true"]{background:var(--amarillo);transform:translateY(-3px)}
#thPanel .th:active{transform:translate(3px,3px);box-shadow:none}
#thPanel .th:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
html[lang="ar"] #thPanel .th{font-family:'Noto Kufi Arabic',sans-serif;font-size:12px}
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div class="top"><button type="button" id="bOut" data-i="logout">Cerrar sesión</button></div>
<div class="langs" role="group" aria-label="Language"><button data-l="es">ES</button><button data-l="en">EN</button><button data-l="ar">AR</button></div>
<main>
  <h1 class="title"><i></i><span id="ttl" data-i="ttl">Mini Juegos</span><i></i></h1>
  <section id="vGames" class="stack" style="display:flex;flex-direction:column;gap:20px">
    <div class="sub" id="sub" data-i="sub" style="align-self:center">Elige un juego</div>
    <div class="bar"><button type="button" class="mini" id="bEdit" data-i="edit">Editar perfil</button><button type="button" class="mini" id="bTheme" data-i="thm" aria-expanded="false" aria-controls="thPanel">Temas</button></div>
    <div class="box hidden" id="thPanel" role="group" aria-label="Temas"></div>
    <nav id="games"></nav>
  </section>
  <section id="vEdit" class="stack hidden">
    <button type="button" class="mini" id="bBack" data-i="back" style="align-self:flex-start">← Volver</button>
    <div class="box profile" id="pfBox">
    <div class="msg" data-i="profile">Tu perfil</div>
    <input id="nameIn" maxlength="12" autocomplete="off" data-ph="namePh" placeholder="Tu nombre">
    <div class="avrow" id="avatars" role="group"></div>
    <div class="msg" data-i="colorLbl">Tu color</div>
    <div class="avrow swrow" id="colors" role="group"></div>
    <div class="msg" data-i="frameLbl">Tu marco</div>
    <div class="avrow" id="frames" role="group"></div>
    <div class="pprev"><div class="pcard" id="pfPrev"></div></div>
    <div class="msg" id="pfMsg" role="status" aria-live="polite"></div>
    <button class="btn ok" id="pfSave" type="button" data-i="save">Guardar</button>
  </div>
  </section>
</main>

/* ===== Perfil compartido: el mismo editor en index.html (creación) y minijuegos.html (edición) ===== */
const IMG_OK=/^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/;
const NF=12, NC=24; // marcos y colores disponibles
const COLORS=["#c8f2d4","#ffd9b8","#c7e3ff","#ffb7d0","#d9c2f0","#fff4b8","#a6f0e0","#ffc2c2","#ffe0f0","#e0f7fa","#f3e5ff","#ffecb3","#d0f0c0","#ffcba4","#b5ead7","#ff9aa2","#a0c4ff","#caffbf","#fdffb6","#bdb2ff","#ffc6ff","#9bf6ff","#ffadad","#e4c1f9"];

/* o = {db, fs (módulo firestore), uid:()=>uid, t, lang:()=>idioma, onSave(perfil)} */
function profileEditor(o){
  const $=s=>document.querySelector(s), t=o.t;
  const avBox=$("#avatars"), nameIn=$("#nameIn"), msgEl=$("#pfMsg"), prevEl=$("#pfPrev"), saveBtn=$("#pfSave"), colBox=$("#colors"), frBox=$("#frames");
  const FIX=["chica","chico"];
  let me={name:"",av:"",c:Math.floor(Math.random()*NC),f:0}, CHARS=[], CATS=[], chCat=null, unsub=null, saving=false, mk=null, mkind="";
  avBox.classList.add("chars");

  /* Datos de Firestore: siempre validados antes de pintarlos */
  const chOk=c=>c&&typeof c.data==="string"&&c.data.length<900000&&IMG_OK.test(c.data);
  const nm=x=>{ const n=x&&x.names; const v=(n&&typeof n==="object"&&(n[o.lang()]||n.es))||(x&&x.name)||""; return typeof v==="string"?v.slice(0,24):""; };
  const coverOf=x=>{ const d=x&&(x.cover||x.data); return (typeof d==="string"&&d.length<900000&&IMG_OK.test(d))?d:null; };
  const catLabel=id=>id==="chica"?t("catGirl"):id==="chico"?t("catBoy"):nm(CATS.find(k=>k.id===id));
  const visCats=()=>FIX.concat(CATS.filter(k=>!FIX.includes(k.id)).map(k=>k.id)); // Chica y Chico siempre + las que crees en el admin

  function say(k,kind){ mk=k; mkind=kind||""; msgEl.textContent=k?t(k):""; msgEl.className="msg"+(kind==="err"?" err":kind==="good"?" good":""); }

  function paintPrev(){
    prevEl.className="pcard f"+me.f; prevEl.style.setProperty("--pc",COLORS[me.c]); prevEl.textContent="";
    const av=document.createElement("div"); av.className="pav";
    const ch=CHARS.find(x=>x.id===me.av); if(ch){ const im=new Image(); im.src=ch.data; im.alt=""; av.appendChild(im); }
    const n=document.createElement("div"); n.className="pname"; n.textContent=me.name||t("namePh");
    prevEl.append(av,n);
  }
  function syncRows(){
    colBox.querySelectorAll("button").forEach((b,i)=>{ b.setAttribute("aria-pressed",i===me.c); b.setAttribute("aria-label",t("colorWord")+" "+(i+1)); });
    frBox.querySelectorAll("button").forEach((b,i)=>{ b.setAttribute("aria-pressed",i===me.f); b.setAttribute("aria-label",t("frameWord")+" "+(i+1)); b.style.setProperty("--pc",COLORS[me.c]); });
  }
  function buildRows(){
    colBox.textContent=""; frBox.textContent="";
    COLORS.forEach((c,i)=>{ const bt=document.createElement("button"); bt.type="button"; bt.className="sw"; bt.style.setProperty("--s",c);
      bt.onclick=()=>{ me.c=i; syncRows(); paintPrev(); }; colBox.appendChild(bt); });
    for(let i=0;i<NF;i++){ const bt=document.createElement("button"); bt.type="button"; bt.className="fb f"+i;
      bt.onclick=()=>{ me.f=i; syncRows(); paintPrev(); }; frBox.appendChild(bt); }
  }
  function paintChars(){
    avBox.textContent=""; const vis=visCats(), VC=CHARS.filter(c=>vis.includes(c.cat));
    if(VC.length&&!VC.some(c=>c.id===me.av)) me.av=VC[Math.floor(Math.random()*VC.length)].id;
    if(chCat&&!vis.includes(chCat)) chCat=null;
    if(!chCat){
      const cur=(VC.find(c=>c.id===me.av)||{}).cat;
      vis.forEach(id=>{ const bt=document.createElement("button"); bt.type="button"; bt.className="cat"; bt.setAttribute("aria-pressed",id===cur);
        const cvd=coverOf(CATS.find(k=>k.id===id));
        if(cvd){ const im=new Image(); im.src=cvd; im.alt=""; bt.appendChild(im); } else { const ph=document.createElement("i"); ph.className="ph"; bt.appendChild(ph); }
        const sp=document.createElement("span"); sp.textContent=catLabel(id); bt.appendChild(sp);
        bt.onclick=()=>{ chCat=id; paintChars(); }; avBox.appendChild(bt); });
      return;
    }
    const back=document.createElement("button"); back.type="button"; back.className="mini"; back.style.cssText="width:100%;height:auto"; back.textContent=t("chBack");
    back.onclick=()=>{ chCat=null; paintChars(); }; avBox.appendChild(back);
    const items=VC.filter(c=>c.cat===chCat);
    if(!items.length){ const e=document.createElement("div"); e.className="msg"; e.style.width="100%"; e.textContent=t("noChars"); avBox.appendChild(e); return; }
    items.forEach(c=>{ const bt=document.createElement("button"); bt.type="button"; bt.dataset.av=c.id; bt.setAttribute("aria-label",(typeof c.name==="string"&&c.name)?c.name.slice(0,20):"character"); bt.setAttribute("aria-pressed",c.id===me.av);
      const im=new Image(); im.src=c.data; im.alt=""; bt.appendChild(im);
      bt.onclick=()=>{ me.av=c.id; avBox.querySelectorAll("button[data-av]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.av===c.id)); paintPrev(); }; avBox.appendChild(bt); });
  }
  function paintAll(){ nameIn.setAttribute("aria-label",t("namePh")); paintChars(); syncRows(); paintPrev(); }

  nameIn.addEventListener("input",()=>{ if(/[<>]/.test(nameIn.value)) nameIn.value=nameIn.value.replace(/[<>]/g,""); me.name=cleanName(nameIn.value); paintPrev(); });
  nameIn.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); save(); } });
  saveBtn.onclick=save;
  buildRows();

  const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),ms))]);
  async function save(){
    if(saving) return;
    const name=cleanName(nameIn.value);
    if(!name){ say("errName","err"); nameIn.focus(); return; }
    if(!CHARS.some(c=>c.id===me.av)){ say("errAv","err"); return; }
    const uid=o.uid(); if(!uid){ say("errGen","err"); return; }
    const data={name,av:me.av,c:me.c,f:me.f};
    if(!profileOk(data)){ say("errGen","err"); return; }
    saving=true; saveBtn.disabled=true; say("saving");
    try{
      await withTimeout(o.fs.setDoc(o.fs.doc(o.db,"usuarios",uid),data),15000);
      saveLocalProfile(uid,data); // copia de respaldo
      say("saved","good"); if(o.onSave) o.onSave(data);
    }catch(e){
      console.warn(e); const c=(e&&e.code)||"";
      say(c==="permission-denied"?"errPerm":(c==="timeout"||c==="unavailable"||/network/.test(c))?"errNet":"errGen","err");
    }finally{ saving=false; saveBtn.disabled=false; }
  }

  return {
    set(p){ if(p&&typeof p==="object"){ me.name=cleanName(p.name); if(typeof p.av==="string"&&p.av.length<80&&!p.av.includes("/")) me.av=p.av; if(Number.isInteger(p.c)&&p.c>=0&&p.c<NC) me.c=p.c; if(Number.isInteger(p.f)&&p.f>=0&&p.f<NF) me.f=p.f; }
      nameIn.value=me.name; chCat=null; say(null); paintAll(); },
    start(){
      if(unsub) return;
      unsub=o.fs.onSnapshot(o.fs.collection(o.db,"personajes"),snap=>{
        const all=snap.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>(x.ts||0)-(y.ts||0));
        CATS=all.filter(d=>d.type==="cat");
        CHARS=all.filter(d=>d.type!=="cat"&&typeof d.cat==="string"&&chOk(d));
        paintAll();
      },e=>{ console.warn("Personajes:",e); unsub=null; say("errChars","err"); });
    },
    repaint(){ paintAll(); if(mk) say(mk,mkind); },
    say
  };
}

/* ===== Escena anime pixel art: cielo rosado, sol, Fuji, torii, sakura y pétalos ===== */
const cv=$("#scene"),g=cv.getContext("2d"),bg=document.createElement("canvas"),b=bg.getContext("2d");
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches, PX=3;
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let W,H,petals=[],clouds=[];
const SKY=["#c9b6f2","#dcbcf0","#efc2ec","#ffc8dd","#ffd5d9","#ffe4d6"],PINK=["#ffb7d0","#ff94b8","#ffd6e7","#ffe9f1"];
function R(x,y,w,h,c){b.fillStyle=c;b.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function build(){
  W=Math.ceil(innerWidth/PX);H=Math.ceil(innerHeight/PX);cv.width=bg.width=W;cv.height=bg.height=H;
  const r=rng(7), gy=Math.round(H*.8), band=gy/SKY.length;
  for(let i=0;i<SKY.length;i++){R(0,i*band,W,band+1,SKY[i]); if(i)for(let x=0;x<W;x+=2)R(x+(0),i*band-1,1,1,SKY[i-1]);} /* tramado entre franjas */
  R(0,gy,W,H-gy,"#ffc9db");
  /* sol */
  const sx=W*.76,sy=H*.2,sr=Math.max(9,Math.min(W,H)*.07);
  for(let y=-sr*1.6;y<=sr*1.6;y++)for(let x=-sr*1.6;x<=sr*1.6;x++){const d=Math.hypot(x,y); if(d<=sr)R(sx+x,sy+y,1,1,"#fff4cf"); else if(d<=sr*1.6&&(x+y)%2===0)R(sx+x,sy+y,1,1,"#ffd9e6");}
  /* montañas lejanas + Fuji */
  const fx=W*.3,fh=H*.3,fw=fh*1.7;
  for(let x=0;x<W;x++){const m=gy-(H*.09+Math.sin(x*.045)*H*.03+Math.sin(x*.11+2)*H*.012); R(x,m,1,gy-m,"#d9c4ee");}
  for(let y=0;y<fh;y++){const hw=(y/fh)*fw/2, top=gy-fh+y; R(fx-hw,top,hw*2,1,y<fh*.22?"#fff":"#b7a3de"); if(y<fh*.3&&y>fh*.1&&y%2===0)R(fx-hw+ (y%4),top,2,1,"#e9dcf5");}
  for(let x=0;x<W;x++){const m=gy-(H*.05+Math.sin(x*.07+1)*H*.02); R(x,m,1,gy-m,"#c4aee6");}
  /* torii */
  const tx=W*.5,tb=gy+2,th=Math.max(34,H*.18),tw=th*1.1;
  R(tx-tw/2+3,tb-th,4,th,"#d9363e");R(tx+tw/2-7,tb-th,4,th,"#d9363e");
  R(tx-tw/2+5,tb-th,2,th,"#8f1f2e");R(tx+tw/2-5,tb-th,2,th,"#8f1f2e");
  R(tx-tw/2-5,tb-th-4,tw+10,4,"#8f1f2e");R(tx-tw/2-3,tb-th-8,tw+6,4,"#d9363e");R(tx-tw/2-7,tb-th-10,5,3,"#d9363e");R(tx+tw/2+2,tb-th-10,5,3,"#d9363e");
  R(tx-tw/2+3,tb-th*.72,tw-6,3,"#d9363e");
  /* colinas y suelo con flores */
  for(let x=0;x<W;x++){const m=gy-Math.sin(x*.03)*3-2; R(x,m,1,4,"#ffe1ec");}
  for(let i=0;i<W*H/260;i++){const x=r()*W,y=gy+4+r()*(H-gy-4);R(x,y,1,1,PINK[Math.floor(r()*4)]);}
  /* árbol de sakura a la derecha */
  const trx=W*.86,th2=H*.42;
  R(trx-2,gy-th2,5,th2+4,"#7a4a63");R(trx-1,gy-th2,2,th2,"#9a6280");
  R(trx-14,gy-th2*.75,14,2,"#7a4a63");R(trx+3,gy-th2*.6,13,2,"#7a4a63");
  const cr=th2*.42;
  for(let i=0;i<Math.max(900,cr*cr*.6);i++){const a=r()*6.283,d=Math.sqrt(r())*cr;R(trx+Math.cos(a)*d*1.25,gy-th2-cr*.3+Math.sin(a)*d*.8,2,2,PINK[Math.floor(r()*4)]);}
  /* árbol pequeño a la izquierda */
  const t2=W*.07,h2=H*.28;R(t2-1,gy-h2,3,h2+3,"#7a4a63");
  for(let i=0;i<420;i++){const a=r()*6.283,d=Math.sqrt(r())*h2*.4;R(t2+Math.cos(a)*d*1.2,gy-h2-6+Math.sin(a)*d*.8,2,2,PINK[Math.floor(r()*4)]);}
  clouds=[0,1,2,3].map(i=>({x:r()*W,y:H*(.07+i*.09+r()*.04),k:Math.max(1.5,H/110)*(.7+r()*.6),v:.02+r()*.04}));
  const n=Math.max(30,Math.min(90,Math.round(W/9)));petals=[];for(let i=0;i<n;i++)petals.push(newPetal(true));
  if(REDUCED)draw(0);
}
function newPetal(init){return{x:Math.random()*W,y:init?Math.random()*H:-4,vx:.1+Math.random()*.3,vy:.15+Math.random()*.3,c:PINK[Math.floor(Math.random()*4)],ph:Math.random()*6,s:Math.random()<.3?2:1};}
function cloud(c){const k=c.k;g.fillStyle="#fff7fb";g.globalAlpha=.85;g.fillRect(Math.round(c.x),Math.round(c.y+3*k),Math.round(14*k),Math.round(k*1.4));g.fillRect(Math.round(c.x+2*k),Math.round(c.y+1.5*k),Math.round(8*k),Math.round(k*1.6));g.fillRect(Math.round(c.x+4*k),Math.round(c.y),Math.round(4*k),Math.round(k*1.5));g.globalAlpha=1;}
function draw(t){
  g.drawImage(bg,0,0);
  clouds.forEach(c=>{if(!REDUCED){c.x+=c.v;if(c.x>W+20*c.k)c.x=-20*c.k;}cloud(c);});
  petals.forEach(p=>{if(!REDUCED){p.ph+=.04;p.x+=p.vx+Math.sin(p.ph)*.25;p.y+=p.vy;if(p.y>H||p.x>W+4){Object.assign(p,newPetal(false));}}g.fillStyle=p.c;g.fillRect(Math.round(p.x),Math.round(p.y),p.s+1,p.s);});
}
function frame(t){draw(t);requestAnimationFrame(frame);}
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(build,200);});
build();if(!REDUCED)requestAnimationFrame(frame);


</script>
